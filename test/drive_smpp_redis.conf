# Ports match drive_smpp hardcoded values:
#   SMPP port  : 2345  (drive_smpp listens here)
#   smsbox port: 13001 (drive_smpp smsbox_thread connects here)
#   admin port : 13000

group = core
admin-port = 13000
smsbox-port = 13001
admin-password = bar
log-file = "test_redis_bb.log"
box-deny-ip = "*.*.*.*"
box-allow-ip = "127.0.0.1"
store-type = redis
store-location = redis_store_id

group = redis-connection
id = redis_store_id
host = localhost
port = 6379
database = 1
max-connections = 2

group = store-db
id = redis_store_id
table = kannel_test_store
hash = no

group = smsc
smsc = smpp
smsc-id = smpp
host = 127.0.0.1
port = 2345
system-type = "VMA"
address-range = ""
smsc-username = "foo"
smsc-password = "bar"

group = smsc
smsc = smpp
smsc-id = smpp
host = 127.0.0.1
receive-port = 2345
system-type = "VMA"
address-range = ""
smsc-username = "foo"
smsc-password = "bar"

group = smpp-tlv
name   = my_receipted_message_id
tag    = 0x001E
type   = octetstring
length = 65

group = smsbox
bearerbox-host = 127.0.0.1
sendsms-port = 13013
global-sender = 123
log-file = "smsbox.log"

group = sms-service
keyword = default
text = "No service specified"
